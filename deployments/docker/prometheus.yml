# ==============================================================================
# Prometheus Time-Series Metrics Scrape Configuration for Docker Compose
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fastapi"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "fastapi-clean-architecture"
          environment: "production"
