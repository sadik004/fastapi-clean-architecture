name: Production CI/CD Pipeline & Quality Gates

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Static Code Quality & Formatting
  # ----------------------------------------------------------------------------
  lint:
    name: "Stage 1: Lint & Code Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting Toolchain
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check app tests alembic scripts load_tests

      - name: Verify Code Formatting
        run: ruff format --check app tests alembic scripts load_tests

  # ----------------------------------------------------------------------------
  # Stage 2: Strict Static Type Checking
  # ----------------------------------------------------------------------------
  type-check:
    name: "Stage 2: Static Type Checking"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-redis types-requests types-PyYAML pytest pytest-asyncio pytest-cov httpx locust fakeredis

      - name: Execute Strict Mypy Verification
        run: mypy --strict app tests alembic scripts

  # ----------------------------------------------------------------------------
  # Stage 3: Static Application Security Testing (SAST)
  # ----------------------------------------------------------------------------
  security-audit:
    name: "Stage 3: Static Security Audits (SAST)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Security Tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep

      - name: Execute Bandit SAST Scan (Zero High/Medium Issues)
        run: bandit -r app -ll

      - name: Execute Semgrep Architectural Rules Scan
        run: semgrep scan --config=.semgrep.yml app

  # ----------------------------------------------------------------------------
  # Stage 4: Clean Architecture & Module Dependency Invariant Gate
  # ----------------------------------------------------------------------------
  architecture-audit:
    name: "Stage 4: Architecture Compliance Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Execute Architecture Compliance Linter
        run: python scripts/audit_architecture.py

  # ----------------------------------------------------------------------------
  # Stage 5: Full Regression Test Suite
  # ----------------------------------------------------------------------------
  test-suite:
    name: "Stage 5: Test Suite Regression"
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Application Dependencies & Test Harnesses
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx locust fakeredis

      - name: Run Test Suite
        env:
          TESTING: "true"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: pytest --maxfail=1 --durations=10

  # ----------------------------------------------------------------------------
  # Stage 6: Production Multi-Stage Container Build & Security Attestation
  # (Executes ONLY if all 5 quality gates pass!)
  # ----------------------------------------------------------------------------
  docker-build:
    name: "Stage 6: Multi-Stage Container Build Gate"
    runs-on: ubuntu-latest
    needs: [lint, type-check, security-audit, architecture-audit, test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Multi-Stage Production Image
        run: |
          docker build \
            --tag fastapi-clean-architecture:latest \
            --file Dockerfile .

      - name: Verify Non-Root User Execution (UID 10001)
        run: |
          RUNNER_UID=$(docker run --rm fastapi-clean-architecture:latest id -u)
          echo "Verified container executes as UID: $RUNNER_UID"
          if [ "$RUNNER_UID" != "10001" ]; then
            echo "ERROR: Container is not running as unprivileged appuser (UID 10001)!"
            exit 1
          fi

      - name: Verify Distroless Layer & No Compiler Toolchains
        run: |
          if docker run --rm fastapi-clean-architecture:latest which gcc 2>/dev/null; then
            echo "SECURITY VIOLATION: gcc compiler leaked into runtime stage!"
            exit 1
          fi
          echo "Hardened runtime verified: zero compiler toolchains present."
